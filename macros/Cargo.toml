[package]
name = "openai-agents-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macros for openai-agents (function_tool)"
license = "MIT"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
