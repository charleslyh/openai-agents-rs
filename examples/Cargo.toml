[package]
name = "opai-agents-examples"
version.workspace = true
edition.workspace = true
publish = false
description = "Runnable examples for the Rust OpenAI Agents SDK"

# The sources live in `src/`, not in `examples/`, and every example is declared explicitly below.
#
# Auto-discovery would look for `examples/*.rs` *inside this package* — and since the package
# directory is itself named `examples`, that means `examples/examples/*.rs`. Hence the explicit
# `[[example]]` paths: the directory keeps its name, `cargo run --example hello` keeps working, and
# the files can sit in `src/` next to the shared `common` module (`mod common;` resolves against
# the example's own root file, so `src/common/mod.rs` is picked up as before).
autoexamples = false

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

# One entry per file in `src/`; `src/common/` is a module, not an example, so it is not listed.
#
# The `NN_` prefixes order the directory for a reader working through it top to bottom: first the
# smallest agent and the zero-configuration one, then one group per web-demo checklist item (see
# `demo/web/assets/index.html`): conversation and memory, tools, multi-agent, safety and
# governance, output and observability, run control. The number is the position in this file, so
# when you add an example put it at the end of its group and renumber the ones after it (`git mv`
# keeps the history). The prefixes are *not* part of the target name: `name` stays a bare
# identifier, so the command is `cargo run -p opai-agents-examples --example hello`, not
# `--example 01_hello`.
#
# Adding a file means adding a section here — which is also where a per-example
# `required-features` would go if one of them ever needs an extra facade feature. One example per
# knowledge point; only closely related ideas share a file. The full web console lives in
# `demo/web`.
#
# `mcp` needs the facade's `mcp` feature (declared with the dependency below).

[[example]]
name = "hello"
path = "src/01_hello.rs"

[[example]]
name = "zero_config"
path = "src/02_zero_config.rs"

