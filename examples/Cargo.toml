[package]
name = "openai-agents-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runnable examples for the Rust OpenAI Agents SDK"

# The sources live in `src/`, not in `examples/`, and every example is declared explicitly below.
#
# Auto-discovery would look for `examples/*.rs` *inside this package* — and since the package
# directory is itself named `examples`, that means `examples/examples/*.rs`. Hence the explicit
# `[[example]]` paths: the directory keeps its name, `cargo run --example hello` keeps working, and
# the files can sit in `src/` next to the shared `common` module (`mod common;` resolves against
# the example's own root file, so `src/common/mod.rs` is picked up as before).
autoexamples = false

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

# One entry per file in `src/`; `src/common/` is a module, not an example, so it is not listed.
#
# The `NN_` prefixes order the directory for a reader working through them in order (hello → tools →
# streamed → …). They are *not* part of the target name: `name` stays a bare identifier, so the
# command is `cargo run -p openai-agents-examples --example hello`, not `--example 01_hello`.
# Adding a file means adding a section here — which is also where a per-example `required-features`
# would go if one of them ever needs an extra facade feature.
# One example per knowledge point, ordered like the web demo's capability checklist (see
# `demo/web/assets/index.html`): conversation and memory, tools, multi-agent,
# safety and governance,
# output and observability, run control. Each header names the checklist item it covers;
# the full web console lives in `demo/web`. Only closely related ideas share a file.
#
# `mcp` needs the facade's `mcp` feature (declared with the dependency below).

[[example]]
name = "hello"
path = "src/01_hello.rs"

# Conversation and memory
[[example]]
name = "streamed"
path = "src/02_streamed.rs"

[[example]]
name = "memory"
path = "src/03_memory.rs"

[[example]]
name = "compaction"
path = "src/04_compaction.rs"

# Tools
[[example]]
name = "tools"
path = "src/05_tools.rs"

[[example]]
name = "parallel_tools"
path = "src/06_parallel_tools.rs"

[[example]]
name = "tool_timeout"
path = "src/07_tool_timeout.rs"

[[example]]
name = "tool_recovery"
path = "src/08_tool_recovery.rs"

[[example]]
name = "mcp"
path = "src/09_mcp.rs"

# Multi-agent
[[example]]
name = "handoff"
path = "src/10_handoff.rs"

[[example]]
name = "agents_as_tools"
path = "src/11_agents_as_tools.rs"

# Safety and governance
[[example]]
name = "hitl"
path = "src/12_hitl.rs"

[[example]]
name = "always_approve"
path = "src/13_always_approve.rs"

[[example]]
name = "input_guardrail"
path = "src/14_input_guardrail.rs"

[[example]]
name = "output_guardrail"
path = "src/15_output_guardrail.rs"

[[example]]
name = "tool_input_guardrail"
path = "src/16_tool_input_guardrail.rs"

[[example]]
name = "tool_output_guardrail"
path = "src/17_tool_output_guardrail.rs"

# Output and observability
[[example]]
name = "structured_output"
path = "src/18_structured_output.rs"

[[example]]
name = "run_context"
path = "src/19_run_context.rs"

[[example]]
name = "hooks"
path = "src/20_hooks.rs"

[[example]]
name = "usage"
path = "src/21_usage.rs"

[[example]]
name = "tracing"
path = "src/22_tracing.rs"

# Run control
[[example]]
name = "cancel"
path = "src/23_cancel.rs"

[[example]]
name = "settings"
path = "src/24_settings.rs"

[[example]]
name = "reasoning"
path = "src/25_reasoning.rs"

[[example]]
name = "capability"
path = "src/26_capability.rs"

[[example]]
name = "verdict_transform"
path = "src/27_verdict_transform.rs"

# The sources are user-facing code, so they live at the repository root rather than inside
# `crates/facade`. They depend on the facade the way a user's project would.
#
# `openai` is on, and every example needs it: `common::model()` builds an `OpenAIChatCompletions-
# Model` or an `OpenAIResponsesModel` from `OPENAI_API_KEY`, and that is the point of most of them.
# A consequence: this package activates the facade's `openai` feature whenever it is built, which
# is why the root manifest sets `default-members = ["crates/*"]` — `cargo test --no-default-features`
# must keep verifying that the SDK builds without an HTTP client.
[dependencies]
# `20_hooks.rs` implements `AgentHooks`, whose methods are `async_trait`.
async-trait = "0.1"
# `mcp` is needed by the `mcp` example only (a real MCP server over stdio: the example's own
# binary re-executed with `--mcp-server`). Every example in this package compiles the
# `openai-agents-mcp` crate too because of it.
openai-agents = { path = "../crates/facade", version = "0.1.0", features = ["openai", "mcp"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
