# The sources are user-facing code, so they live at the repository root rather than inside
# `crates/facade`. They depend on the facade the way a user's project would.
#
# `openai` is on, and every example needs it: `common::model()` builds an `OpenAIChatCompletions-
# Model` or an `OpenAIResponsesModel` from `OPENAI_API_KEY`, and that is the point of most of them.
# A consequence: this package activates the facade's `openai` feature whenever it is built, which
# is why the root manifest sets `default-members = ["crates/*"]` — `cargo test --no-default-features`
# must keep verifying that the SDK builds without an HTTP client.
[dependencies]
# `20_hooks.rs` implements `AgentHooks`, whose methods are `async_trait`.
async-trait = { workspace = true }
# `mcp` is needed by the `mcp` example only (a real MCP server over stdio: the example's own
# binary re-executed with `--mcp-server`). Every example in this package compiles the
# `opai-agents-mcp` crate too because of it.
opai-agents = { workspace = true, features = ["openai", "mcp", "providers", "sessions", "observability", "tools", "guardrails", "teams", "sqlite", "webfetch"] }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
