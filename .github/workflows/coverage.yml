name: coverage

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # A ratchet, not a target: raise `--fail-under-lines` as coverage grows. The point of the
      # gate is that a large new module cannot land with no tests at all, which is how the
      # uncovered parts of this crate got that way.
      - name: Measure
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --summary-only --fail-under-lines 50

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
