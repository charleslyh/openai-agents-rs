name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Module dependency direction
        # The tier map and the tracked upward edges live in the script; the exception list must
        # only ever shrink. See docs/refactor/01-principles.md.
        run: python3 scripts/check_module_deps.py
      - name: Facade Runner mirrors the core Runner
        # The facade wraps every `Runner` method to install the default model provider; this fails
        # when core gains, loses or changes a method without the wrapper following.
        run: python3 scripts/check_runner_api.py
      - name: Clippy (all features, all targets)
        # `-D warnings` blocks every lint that is not part of the tracked backlog declared in
        # `[workspace.lints]` in Cargo.toml. That list must only ever shrink.
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Docs (no broken intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # `vendor/openai-agents-python` is gitignored, so fetch it at the pinned tag first.
      - name: Fetch the vendored Python SDK
        run: bash scripts/sync_vendor.sh
      - name: Verify the vendored Python SDK pin
        run: bash scripts/sync_vendor.sh --check
      # Layer 1: ScriptedModel behavior, no HTTP client in the build.
      #
      # No `--workspace` anywhere below, and that is deliberate: the root `examples/` and `demo/web`
      # packages are members but not *default* members, because they turn on the facade's `openai` feature. A
      # `--workspace` run would build it, activate that feature for the whole graph, and quietly
      # stop this run from proving the SDK still builds with no HTTP client.
      - name: Behavior tests (no default features)
        run: cargo test --no-default-features
      # Layer 2: OpenAI HTTP contracts through wiremock and the parity scenarios. The MCP client is
      # off by default, so it is only built by the all-features run below.
      - name: Tests (default features)
        run: cargo test
      - name: Tests (all features, incl. SQLite sessions)
        run: cargo test --all-features
      # The examples are user-facing code: a breaking change to the public API shows up here.
      - name: Examples still compile
        run: cargo build -p openai-agents-examples --examples
      - name: Web demo still compiles and its tests pass
        run: cargo test -p openai-agents-web-demo

  parity:
    name: python oracle (parity, MCP interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the vendored Python SDK
        run: bash scripts/sync_vendor.sh
      - name: Oracle venv
        run: bash conformance/setup_venv.sh
      # Layer 3a: fail if a committed golden no longer matches what the Python SDK does.
      # Regenerating is a separate, deliberate step (--write-golden), never part of CI.
      - name: Parity goldens match the Python SDK
        run: .venv/bin/python conformance/run_parity.py --check
      - name: Parity scenarios in Rust
        run: cargo test --test parity_scenarios
      # Layer 3b: two independent implementations over the wire (real Python MCP server).
      - name: MCP interoperability
        # `mcp` is off by default: without the flag this compiles to zero tests and still passes.
        run: cargo test --features mcp --test mcp_interop
      - name: Chat Completions converter parity
        run: cargo test --test chat_convert_parity
