[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "openai-agents"
version = "0.1.0"
edition = "2021"
description = "Rust port of the OpenAI Agents Python SDK (Phase-1 subset)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/charleslyh/openai-agents-rust"
keywords = ["openai", "agents", "llm", "tools"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["openai"]
openai = ["dep:async-openai", "dep:reqwest"]
testing = ["openai", "dep:wiremock"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
openai-agents-macros = { path = "macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Optional OpenAI HTTP client (third-party Rust client — verification layer 2)
async-openai = { version = "0.42", optional = true, default-features = false, features = ["chat-completion", "responses"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
wiremock = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
serde_json = "1"

[[example]]
name = "01_hello_agent"
required-features = ["openai"]

[[example]]
name = "02_tools_agent"
required-features = ["openai"]

[[example]]
name = "03_streamed_agent"
required-features = ["openai"]

[[example]]
name = "04_handoff_agent"
required-features = ["openai"]

[[example]]
name = "05_agents_as_tools"
required-features = ["openai"]

[[example]]
name = "06_human_in_the_loop"
required-features = ["openai"]

[[example]]
name = "07_always_approve"
required-features = ["openai"]

[[example]]
name = "08_mock_framework"
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true
