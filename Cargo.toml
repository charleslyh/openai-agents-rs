[workspace]
members = ["crates/*", "examples", "demo/web", "tools/console"]
# The examples and demo packages turn on the facade's `openai` feature, which would defeat
# `cargo test --no-default-features` (the check that the SDK still builds with no HTTP client).
# Keeping them out of the default set preserves that check; build them explicitly with `-p`.
# `tools/console` is a program of its own (a web server), not part of the SDK, so it sits outside
# `crates/*` for the same reason.
default-members = ["crates/*"]
resolver = "2"

# Dependencies every crate needs with the *same* features, so the version is declared once.
#
# Deliberately not here: `tokio`, `reqwest` and the path dependencies.
#   - `tokio` / `reqwest` take different feature sets per crate (`tokio/process` only for the MCP
#     stdio transport, `reqwest` only where HTTP is used). Cargo unions features across a build, so
#     declaring them once here would pull the widest set into every crate that names them.
#   - The `opai-agents-*` crates are path dependencies, and some are `optional` (a facade
#     feature turns them on). Keeping those next to the feature that needs them reads better than
#     splitting the declaration across two files.
[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Lints every member inherits with `[lints] workspace = true`.
#
# These three are a *known, tracked backlog*, not a preference: `-D warnings` in CI blocks every
# other lint, and this list must only ever shrink. Counts as of the 2026-10 re-audit (see
# docs/refactor/06-progress.md for how to re-count):
#   result_large_err           63 — `AgentsError` is a big enum, so `Result<_, AgentsError>` is
#                                   large on the stack. Fixing it means boxing the error variant
#                                   (an API change) or shrinking `ModelStatusError`; both need a
#                                   design pass.
#   field_reassign_with_default 35 — mechanical (`Y { field, ..Default::default() }`), mostly in
#                                   tests and examples.
#   needless_question_mark       8 — emitted inside `#[function_tool]`-generated code, so it can
#                                   only be fixed in the macro crate.
[workspace.lints.rust]
# No crate needs `unsafe`; forbidding it keeps it that way (and lets reviewers skip the question).
unsafe_code = "forbid"

[workspace.lints.clippy]
result_large_err = "allow"
field_reassign_with_default = "allow"
needless_question_mark = "allow"
