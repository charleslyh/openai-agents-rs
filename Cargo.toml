[workspace]
members = [".", "openai-agents-macros"]
resolver = "2"

[package]
name = "openai-agents"
version = "0.1.0"
edition = "2021"
description = "Rust port of the OpenAI Agents Python SDK (Phase-1 subset)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/charleslyh/openai-agents-rust"
keywords = ["openai", "agents", "llm", "tools"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["openai"]
openai = ["dep:async-openai", "dep:reqwest"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
openai-agents-macros = { path = "openai-agents-macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Optional OpenAI HTTP client (third-party Rust client — verification layer 2)
async-openai = { version = "0.42", optional = true, default-features = false, features = ["chat-completion", "responses"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
serde_json = "1"

[[example]]
name = "hello_agent"
required-features = ["openai"]

[[example]]
name = "chat_completions_agent"
required-features = ["openai"]

[package.metadata.docs.rs]
all-features = true
