[workspace]
members = [".", "macros"]
resolver = "2"

# Lints every member inherits with `[lints] workspace = true`.
#
# These three are a *known, tracked backlog*, not a preference: `-D warnings` in CI blocks every
# other lint, and this list must only ever shrink. Counts as of the 2026-10 audit:
#   result_large_err          126 — `AgentsError` is a big enum, so `Result<_, AgentsError>` is
#                                   large on the stack. Fixing it means boxing the error variant
#                                   (an API change) or shrinking `ModelStatusError`; both need a
#                                   design pass.
#   field_reassign_with_default 35 — mechanical (`Y { field, ..Default::default() }`), mostly in
#                                   tests and examples.
#   needless_question_mark       8 — emitted inside `#[function_tool]`-generated code, so it can
#                                   only be fixed in the macro crate.
[workspace.lints.clippy]
result_large_err = "allow"
field_reassign_with_default = "allow"
needless_question_mark = "allow"

[package]
name = "openai-agents"
version = "0.1.0"
edition = "2021"
description = "Rust port of the OpenAI Agents Python SDK (core loop, tools, handoffs, HITL, guardrails, structured output)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/charleslyh/openai-agents-rs"
keywords = ["openai", "agents", "llm", "tools"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["openai", "mcp"]
openai = ["dep:async-openai", "dep:reqwest"]
# MCP client transports: stdio (child process) and streamable HTTP.
mcp = ["dep:reqwest", "tokio/process", "tokio/io-util"]
# `SqliteSession`: file or in-memory conversation storage, same schema as the Python SDK.
sqlite = ["dep:rusqlite"]

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
async-trait = "0.1"
futures = "0.3"
openai-agents-macros = { path = "macros", version = "0.1.0" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Optional SQLite session backend
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }

# Optional OpenAI HTTP client (third-party Rust client)
async-openai = { version = "0.42", optional = true, default-features = false, features = ["chat-completion", "responses"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Verification layer 1.5: property / randomized tests. See docs/CONTRIBUTING.md.
proptest = "1"
# Used by the HTTP-level contract tests (verification layer 2); not part of the public API.
wiremock = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }

[[example]]
name = "01_hello"
required-features = ["openai"]

[[example]]
name = "02_tools"
required-features = ["openai"]

[[example]]
name = "03_streamed"
required-features = ["openai"]

[[example]]
name = "04_handoff"
required-features = ["openai"]

[[example]]
name = "05_as_tools"
required-features = ["openai"]

[[example]]
name = "06_hitl"
required-features = ["openai"]

[[example]]
name = "07_always_approve"
required-features = ["openai"]

[[example]]
name = "08_structured_output"
required-features = ["openai"]

[[example]]
name = "09_guardrails"
required-features = ["openai"]

[package.metadata.docs.rs]
all-features = true
