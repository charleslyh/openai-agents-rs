[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name = "openai-agents"
version = "0.1.0"
edition = "2021"
description = "Rust port of the OpenAI Agents Python SDK (core loop, tools, handoffs, HITL, guardrails, structured output)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/charleslyh/openai-agents-rs"
keywords = ["openai", "agents", "llm", "tools"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["openai"]
openai = ["dep:async-openai", "dep:reqwest"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
openai-agents-macros = { path = "macros", version = "0.1.0" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Optional OpenAI HTTP client (third-party Rust client)
async-openai = { version = "0.42", optional = true, default-features = false, features = ["chat-completion", "responses"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Used by the HTTP-level contract tests (verification layer 2); not part of the public API.
wiremock = "0.6"
serde_json = "1"

[[example]]
name = "01_hello"
required-features = ["openai"]

[[example]]
name = "02_tools"
required-features = ["openai"]

[[example]]
name = "03_streamed"
required-features = ["openai"]

[[example]]
name = "04_handoff"
required-features = ["openai"]

[[example]]
name = "05_as_tools"
required-features = ["openai"]

[[example]]
name = "06_hitl"
required-features = ["openai"]

[[example]]
name = "07_always_approve"
required-features = ["openai"]

[[example]]
name = "08_structured_output"
required-features = ["openai"]

[[example]]
name = "09_guardrails"
required-features = ["openai"]

[package.metadata.docs.rs]
all-features = true
