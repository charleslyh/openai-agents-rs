[package]
name = "openai-agents-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP client (stdio and streamable HTTP) for the Rust OpenAI Agents SDK"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
openai-agents-core = { path = "../core", version = "0.1.0", default-features = false }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
