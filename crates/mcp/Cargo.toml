[package]
name = "opai-agents-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP client (stdio and streamable HTTP) for the Rust OpenAI Agents SDK"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "mcp", "llm"]
categories = ["api-bindings", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
opai-agents-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
