[package]
name = "opai-agents-sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Session and paused-run storage for the Rust OpenAI Agents SDK: JSONL files, SQLite, Redis and Postgres"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "session", "redis", "sqlite"]
categories = ["asynchronous", "database"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[features]
default = []
# Redis-backed session and state store: a list with an optional TTL, `replace_items` in one
# MULTI. Added with the backend, so a build that does not use Redis compiles no client.
redis = ["dep:redis"]
# Postgres-backed session and state store: every value bound, table names validated before they
# reach SQL. Added with the backend. Needs Rust 1.94: `sqlx` 0.9 declares it as its minimum, while
# the rest of the crate builds on 1.89.
postgres = ["dep:sqlx"]
# `rediss://` (Redis over TLS) through rustls and the platform trust store. Without it a `rediss://`
# URL is refused by the client instead of silently connecting in clear text.
redis-tls = ["redis", "redis/tokio-rustls-comp"]
# SQLite-backed session with the Python SDK's schema, on a bundled `rusqlite`. Merged in from the
# former `opai-agents-sqlite` crate. Do not enable `sqlx/sqlite` next to it: both link `sqlite3`.
sqlite = ["dep:rusqlite"]

[dependencies]
opai-agents-core = { workspace = true }
async-trait = { workspace = true }
# Cross-process file locking (`flock` / `LockFileEx`); a second process touching the same session
# waits instead of interleaving writes.
fs2 = "0.4"
# Signing a stored run state so a state edited outside the process is refused, not resumed.
hmac = "0.12"
sha2 = "0.10"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
redis = { workspace = true, features = ["tokio-comp"], optional = true }
rusqlite = { workspace = true, optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The Redis tests change a stored state behind the store's back, which is the tampering the
# signature is there to catch; they need the client for that. Test profile only.
redis = { workspace = true, features = ["tokio-comp"] }
