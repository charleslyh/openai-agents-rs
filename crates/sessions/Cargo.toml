[package]
name = "openai-agents-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Session and paused-run storage for the Rust OpenAI Agents SDK: JSONL files, Redis and Postgres"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[features]
default = []
# Redis-backed session and state store: list + TTL, atomic replace via MULTI. Added with the
# backend, so a build that does not use Redis does not compile the client.
# redis = ["dep:redis"]
# Postgres-backed session and state store: parameter binding, table names validated against a
# allow-list. Added with the backend.
# postgres = ["dep:sqlx"]

[dependencies]
openai-agents-core = { path = "../core", version = "0.1.0", default-features = false }
async-trait = "0.1"
# Cross-process file locking (`flock` / `LockFileEx`); a second process touching the same session
# waits instead of interleaving writes.
fs2 = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
