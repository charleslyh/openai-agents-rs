[package]
name = "openai-agents-openai"
version = "0.1.0"
edition = "2021"
description = "OpenAI and OpenAI-compatible model adapters (Chat Completions, Responses) for the Rust OpenAI Agents SDK"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
openai-agents-core = { path = "../core", version = "0.1.0" }
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "responses"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
