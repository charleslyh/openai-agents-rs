[package]
name = "opai-agents-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OpenAI and OpenAI-compatible model adapters (Chat Completions, Responses) for the Rust OpenAI Agents SDK"
license.workspace = true
readme = "README.md"
keywords = ["openai", "llm", "chat-completions", "responses"]
categories = ["api-bindings", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
opai-agents-core = { workspace = true }
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "responses"] }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
