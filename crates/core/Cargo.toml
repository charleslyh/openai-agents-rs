[package]
name = "opai-agents-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core of the Rust port of the OpenAI Agents Python SDK: agents, tools, handoffs, HITL, guardrails, the run loop"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "llm", "agent-framework"]
categories = ["api-bindings", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
