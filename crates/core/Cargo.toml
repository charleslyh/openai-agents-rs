[package]
name = "openai-agents-core"
version = "0.1.0"
edition = "2021"
description = "Core of the Rust port of the OpenAI Agents Python SDK: agents, tools, handoffs, HITL, guardrails, the run loop"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = { version = "1", features = ["preserve_order"] }

[package.metadata.docs.rs]
all-features = true
