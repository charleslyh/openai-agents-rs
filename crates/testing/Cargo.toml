[package]
name = "opai-agents-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deterministic test doubles for the Rust OpenAI Agents SDK (ScriptedModel and item builders)"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "testing", "mock"]
categories = ["development-tools::testing"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
opai-agents-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
