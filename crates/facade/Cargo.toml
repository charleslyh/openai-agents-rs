[package]
name = "opai-agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust port of the OpenAI Agents Python SDK (core loop, tools, handoffs, HITL, guardrails, structured output)"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/charleslyh/openai-agents-rs"
keywords = ["openai", "agents", "llm", "tools"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "opai_agents"

[features]
default = ["openai"]
openai = ["dep:opai-agents-openai"]
# MCP client: stdio (child process) and streamable HTTP transports. Off by default, so a build
# that does not talk to MCP servers compiles neither the client nor its process/HTTP code.
mcp = ["dep:opai-agents-mcp"]
# Provider presets: DeepSeek, Gemini, Groq, OpenRouter, Anthropic, Ollama, custom endpoints, the
# capability matrix and the offline model. Off by default; it brings the OpenAI adapters with it,
# because every preset speaks Chat Completions or Responses.
providers = ["dep:opai-agents-providers"]
# `SqliteSession`: file or in-memory conversation storage, same schema as the Python SDK.
sqlite = ["dep:opai-agents-sessions", "opai-agents-sessions/sqlite"]
# `FileSession` (a conversation in a JSONL file) and `FileRunStateStore` (a run that paused for an
# approval). Off by default: nothing in the core loop needs a file.
sessions = ["dep:opai-agents-sessions"]
# `RedisSession` / `RedisRunStateStore`: a history more than one process shares.
redis = ["dep:opai-agents-sessions", "opai-agents-sessions/redis"]
redis-tls = ["redis", "opai-agents-sessions/redis-tls"]
# `PostgresSession` / `PostgresRunStateStore`: a history in a database the deployment already has.
# Needs Rust 1.94 (`sqlx` 0.9); every other feature builds on the declared 1.89.
postgres = ["dep:opai-agents-sessions", "opai-agents-sessions/postgres"]
# Trace processors that export: batched console, JSONL files and counters. Off by default.
observability = ["dep:opai-agents-observability"]
# Ready-made tools: calculator, clock, read-only files. Off by default.
tools = ["dep:opai-agents-tools"]
# `web_fetch`, with the private network off limits. Brings an HTTP client.
webfetch = ["dep:opai-agents-tools", "opai-agents-tools/webfetch"]
# Ready-made guardrails: length, personal data, prompt injection, keywords, schema.
guardrails = ["dep:opai-agents-guardrails"]
# Agent teams: a lead and long-lived teammates that work in parallel, message each other and share
# a task list (Rust-only, X-025). Off by default.
teams = ["dep:opai-agents-teams"]
# Spans as OpenTelemetry spans, in whatever pipeline the process installed.
otel = ["dep:opai-agents-observability", "opai-agents-observability/otel"]

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt"] }
opai-agents-core = { path = "../core", version = "0.1.0" }
opai-agents-macros = { path = "../macros", version = "0.1.0" }
opai-agents-testing = { path = "../testing", version = "0.1.0" }
opai-agents-openai = { path = "../openai", version = "0.1.0", optional = true }
opai-agents-mcp = { path = "../mcp", version = "0.1.0", optional = true }
opai-agents-providers = { path = "../providers", version = "0.1.0", optional = true }
opai-agents-sessions = { path = "../sessions", version = "0.1.0", optional = true }
opai-agents-observability = { path = "../observability", version = "0.1.0", optional = true }
opai-agents-tools = { path = "../tools", version = "0.1.0", optional = true }
opai-agents-guardrails = { path = "../guardrails", version = "0.1.0", optional = true }
opai-agents-teams = { path = "../teams", version = "0.1.0", optional = true }

[dev-dependencies]
async-trait = "0.1"
# Tests and examples that write their own `#[derive(Deserialize, JsonSchema)]` types.
serde = { version = "1", features = ["derive"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
uuid = { version = "1", features = ["v4"] }
# Only the SQLite session tests open a connection themselves, to compare with the Python schema.
rusqlite = { version = "0.32", features = ["bundled"] }
# `tracing` here is the external crate; the SDK module of that name is `opai_agents::tracing`.
tracing = "0.1"
# Verification layer 1.5: property / randomized tests. See docs/CONTRIBUTING.md.
proptest = "1"
# Verification layer 2.5: whole-request snapshots, so a change to any part of the wire body
# has to be reviewed instead of slipping past assertions that only name some fields.
insta = { version = "1", features = ["json"] }
# Verification layer 5: latency benchmarks (`cargo bench`). Built only by `cargo bench`, so they
# cost nothing on `cargo test`.
criterion = "0.5"
# Used by the HTTP-level contract tests (verification layer 2); not part of the public API.
wiremock = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }

[[bench]]
name = "run_loop"
harness = false

[package.metadata.docs.rs]
all-features = true
