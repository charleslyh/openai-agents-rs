[package]
name = "opai-agents-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Proc-macros for opai-agents (function_tool, ToolMeta)"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"
readme = "README.md"
keywords = ["openai", "agents", "proc-macro", "llm"]
categories = ["api-bindings", "development-tools::procedural-macro-helpers"]

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
