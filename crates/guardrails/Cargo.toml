[package]
name = "opai-agents-guardrails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ready-made guardrails for the Rust OpenAI Agents SDK: length, PII redaction, prompt-injection heuristics, blocked keywords, schema validation"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "guardrails", "llm"]
categories = ["api-bindings", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
opai-agents-core = { workspace = true }
# Linear-time matching: a pattern in a guardrail runs on text the user controls.
regex = "1"
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
