[package]
name = "opai-agents-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "SQLite-backed Session for the Rust OpenAI Agents SDK, with the same schema as the Python SDK"
license = "MIT"
readme = "README.md"
keywords = ["openai", "agents", "session", "sqlite"]
categories = ["asynchronous", "database"]
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
opai-agents-core = { path = "../core", version = "0.1.0", default-features = false }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
