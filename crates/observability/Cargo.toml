[package]
name = "opai-agents-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trace processors for the Rust OpenAI Agents SDK: batched export, console, JSONL files, OpenTelemetry"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "tracing", "opentelemetry"]
categories = ["development-tools::debugging", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[features]
default = []
# Write spans as OpenTelemetry spans, into whatever pipeline the process has installed (an OTLP
# collector, Jaeger, a vendor SDK). Only the API: the exporter stays the application's choice, and
# a build that does not use it compiles no OpenTelemetry stack.
otel = ["dep:opentelemetry"]

[dependencies]
# `conversation.rs` implements `RunHooks`, whose methods are `async_trait`.
async-trait = { workspace = true }
opai-agents-core = { workspace = true }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
