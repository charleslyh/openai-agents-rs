[package]
name = "opai-agents-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ready-made tools for the Rust OpenAI Agents SDK: calculator, clock, web fetch, read-only files"
license.workspace = true
readme = "README.md"
keywords = ["openai", "agents", "tools", "llm"]
categories = ["api-bindings", "asynchronous"]
repository.workspace = true

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[features]
default = []
# Fetch a URL. Added with the tool, so a build that does not fetch compiles no HTTP client.
webfetch = ["dep:reqwest", "dep:tokio", "dep:url"]

[dependencies]
opai-agents-core = { workspace = true }
ipnet = "2"
reqwest = { workspace = true, features = ["rustls-tls", "charset", "http2", "macos-system-configuration"], optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"], optional = true }
tracing = { workspace = true }
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
