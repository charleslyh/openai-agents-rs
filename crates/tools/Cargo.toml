[package]
name = "openai-agents-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Ready-made tools for the Rust OpenAI Agents SDK: calculator, clock, web fetch, read-only files"
license = "MIT"
repository = "https://github.com/charleslyh/openai-agents-rs"

# Inherits the lint config (including the tracked clippy backlog) from `[workspace.lints]`.
[lints]
workspace = true

[features]
default = []
# Fetch a URL. Added with the tool, so a build that does not fetch compiles no HTTP client.
webfetch = ["dep:reqwest", "dep:tokio"]

[dependencies]
openai-agents-core = { path = "../core", version = "0.1.0", default-features = false }
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "macos-system-configuration"], optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net"], optional = true }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
